  Note: 'Deleted by launchpad:purge-retention after settings.retention.auth_events_days (180); no trigger guards this table and no FK points at it. Security log + raw material for "one person, ten logins". Written from sub-project 1 onward.'
}

Table risk_signals [headercolor: #EF4444] {
  id char(26) [pk, note: 'ULID']
  kind varchar(24) [not null, note: 'CHECK risk_signals_kind_check: the eight risk_signal_kind values']
  user_id char(26) [ref: > users.id, note: 'plain FK, no cascade (a signal is history). NULL for a product-level signal (the product form of vote_burst)']
  product_id char(26) [ref: > products.id, note: 'plain FK, no cascade. NULL for a member-level signal']
  weight smallint [not null, note: 'CHECK risk_signals_weight_range 0 to 100. Frozen at detection (after any discount); a later setting change never rewrites it. 0 for the product burst form']
  details jsonb [not null, default: '{}', note: 'evidence: ids and counts only (user_ids, vote_ids, observed, threshold, window), never a hash, an address or an e-mail']
  dedupe_key varchar(160) [not null, unique, note: 'one signal per finding: INSERT ... ON CONFLICT (dedupe_key) DO NOTHING, so a rerun costs nothing and an existing row (even a reviewed one) is never touched. Once-per-account kinds (fresh_account, disposable_email) and single_maker_voter have no date in the key; vote_burst:user, login_churn and coordinated_votes carry the UTC date of the run; vote_burst:product the hour']
  detected_at timestamptz [not null, note: 'precision 0 (whole seconds)']
  reviewed_by char(26) [ref: > users.id]
  reviewed_at timestamptz [note: 'precision 0']
  outcome varchar(20) [note: "'confirmed' | 'dismissed' (CHECK risk_signals_outcome_check)"]
  review_note varchar(255)

  indexes {
    (weight desc, detected_at desc, id desc) [name: 'risk_signals_open_queue_index', note: 'PARTIAL: WHERE reviewed_at IS NULL. The open queue, worst first']
    detected_at [name: 'risk_signals_unreviewed_detected_index', note: 'PARTIAL: WHERE reviewed_at IS NULL. The retention purge and the coordinated-votes candidates']
    (reviewed_at desc, id desc) [name: 'risk_signals_reviewed_index', note: 'PARTIAL: WHERE reviewed_at IS NOT NULL. The recently-reviewed list and the purge of reviewed rows']
    (detected_at desc, id desc) [name: 'risk_signals_detected_index', note: 'the all-signals list, newest first']
    (user_id, detected_at)
    (product_id, detected_at)
  }

  Note: '''
  CHECKs: risk_signals_subject_present (user_id IS NOT NULL OR product_id IS NOT NULL) and risk_signals_review_complete
  ((reviewed_by IS NULL) = (reviewed_at IS NULL) AND (reviewed_at IS NULL) = (outcome IS NULL)), plus the kind, outcome and weight checks.
  Written only by launchpad:detect-abuse (every 5 minutes) through SignalWriter, which locks the referenced products and then users
  FOR KEY SHARE in id order before inserting. Reviewed by staff (confirmed counts its full weight for ever, dismissed counts 0, open
  decays linearly over anticheat.decay_days). Retention (PurgeRiskSignals): unreviewed after retention.risk_signals_days (365);
  reviewed after retention.risk_signals_reviewed_days (90) from the review or at most 365 days from detection; reviewed
  fresh_account / disposable_email / single_maker_voter rows are kept for ever so detection cannot resurrect them.
  Staff never see a hash: votes expose 8-hex fingerprints, null once PurgeVoteHashes emptied the vote.
  '''
}

<script>
// ---------------------------------------------------------------------------
// DBML parser (subset used by dbdiagram.io: Project, Table, Enum, TableGroup, Ref)
// ---------------------------------------------------------------------------
(function (global) {
  'use strict';

  const QUOTES = ["'", '"', '`'];

  function stripComments(src) {
    let out = '', q = null;
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (q) {
        out += c;
        if (q === "'''") { if (src.startsWith("'''", i)) { out += "''"; i += 2; q = null; } }
        else if (c === '\\') { out += src[++i] ?? ''; }
        else if (c === q) q = null;
        continue;
      }
      if (src.startsWith("'''", i)) { q = "'''"; out += "'''"; i += 2; continue; }
      if (QUOTES.includes(c)) { q = c; out += c; continue; }
      if (src.startsWith('//', i)) { while (i < src.length && src[i] !== '\n') i++; out += '\n'; continue; }
      if (src.startsWith('/*', i)) {
        const end = src.indexOf('*/', i + 2);
        const chunk = src.slice(i, end < 0 ? src.length : end + 2);
        out += chunk.replace(/[^\n]/g, '');
        i += chunk.length - 1;
        continue;
      }
      out += c;
    }
    return out;
  }

  // Splits on `sep` / newlines while respecting quotes, (), [] and {}.
  function scan(s, isBreak) {
    const out = [];
    let cur = '', q = null, depth = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) {
        cur += c;
        if (q === "'''") { if (s.startsWith("'''", i)) { cur += "''"; i += 2; q = null; } }
        else if (c === '\\') { cur += s[++i] ?? ''; }
        else if (c === q) q = null;
        continue;
      }
      if (s.startsWith("'''", i)) { q = "'''"; cur += "'''"; i += 2; continue; }
      if (QUOTES.includes(c)) { q = c; cur += c; continue; }
      if ('([{'.includes(c)) depth++;
      else if (')]}'.includes(c)) depth--;
      if (depth <= 0 && isBreak(c)) { if (cur.trim()) out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  }
  const statements = body => scan(body, c => c === '\n');
  const splitList = s => scan(s, c => c === ',');

  function dedent(s) {
    const lines = s.replace(/^[ \t]*\n/, '').replace(/\n[ \t]*$/, '').split('\n');
    const widths = lines.filter(l => l.trim()).map(l => l.match(/^[ \t]*/)[0].length);
    const ind = widths.length ? Math.min(...widths) : 0;
    return lines.map(l => l.slice(ind)).join('\n');
  }

  function unquote(v) {
    v = String(v ?? '').trim();
    if (v.length >= 6 && v.startsWith("'''") && v.endsWith("'''")) return dedent(v.slice(3, -3));
    const c = v[0];
    if (v.length >= 2 && QUOTES.includes(c) && v.endsWith(c)) return v.slice(1, -1).replace(/\\(.)/g, '$1');
    return v;
  }

  function parseRefTarget(v) {
    const m = v.trim().match(/^(<>|>|<|-)\s*("[^"]+"|[\w.]+)\.("[^"]+"|\w+)$/);
    return m ? { op: m[1], table: unquote(m[2]), column: unquote(m[3]) } : null;
  }

  function parseSettings(str) {
    const s = { flags: [], refs: [] };
    if (!str) return s;
    for (const part of splitList(str)) {
      const kv = part.match(/^([a-zA-Z_][a-zA-Z_ ]*?)\s*:\s*([\s\S]*)$/);
      if (kv) {
        const k = kv[1].trim().toLowerCase(), v = kv[2].trim();
        if (k === 'note') s.note = unquote(v);
        else if (k === 'default') s.default = { value: unquote(v), expr: v.startsWith('`') };
        else if (k === 'ref') { const r = parseRefTarget(v); if (r) s.refs.push(r); }
        else s[k] = unquote(v);
        continue;
      }
      const f = part.trim().toLowerCase();
      if (f === 'pk' || f === 'primary key') s.pk = true;
      else if (f === 'increment') s.increment = true;
      else if (f === 'not null') s.notNull = true;
      else if (f === 'null') s.nullable = true;
      else if (f === 'unique') s.unique = true;
      else s.flags.push(part.trim());
    }
    return s;
  }

  const COL_RE = /^("[^"]+"|[^\s\[]+)\s+("[^"]+"|[^\s\[(]+(?:\s*\([^)]*\))?)\s*(?:\[([\s\S]*)\])?\s*$/;
  const IDX_RE = /^(\([^)]*\)|`[^`]*`|"[^"]+"|[^\s\[]+)\s*(?:\[([\s\S]*)\])?$/;

  function parseIndex(st) {
    const m = st.match(IDX_RE);
    if (!m) return null;
    const cols = m[1].startsWith('(') ? splitList(m[1].slice(1, -1)).map(unquote) : [unquote(m[1])];
    return { columns: cols, settings: parseSettings(m[2]) };
  }

  function parseTable(name, alias, settings, body, warnings) {
    const t = { name, alias, settings, note: settings.note || '', columns: [], indexes: [] };
    for (const st of statements(body)) {
      let m;
      if ((m = st.match(/^indexes\s*\{([\s\S]*)\}$/i))) {
        for (const ix of statements(m[1])) { const p = parseIndex(ix); if (p) t.indexes.push(p); else warnings.push(`${name}: cannot parse index "${ix}"`); }
      } else if ((m = st.match(/^note\s*:\s*([\s\S]+)$/i))) {
        t.note = unquote(m[1]);
      } else if ((m = st.match(/^note\s*\{([\s\S]*)\}$/i))) {
        t.note = unquote(m[1].trim());
      } else if ((m = st.match(COL_RE))) {
        t.columns.push({ name: unquote(m[1]), type: unquote(m[2]), settings: parseSettings(m[3]), pos: t.columns.length + 1 });
      } else {
        warnings.push(`${name}: cannot parse "${st.split('\n')[0]}"`);
      }
    }
    return t;
  }

  const REF_LINE = /^("[^"]+"|[\w.]+)\.("[^"]+"|\w+)\s*(<>|>|<|-)\s*("[^"]+"|[\w.]+)\.("[^"]+"|\w+)\s*(?:\[([\s\S]*)\])?$/;
  function addRefLine(db, line) {
    const m = line.trim().match(REF_LINE);
    if (!m) { db.warnings.push(`cannot parse Ref "${line}"`); return; }
    const settings = parseSettings(m[6]);
    db.refs.push({
      from: { table: unquote(m[1]), column: unquote(m[2]) }, op: m[3],
      to: { table: unquote(m[4]), column: unquote(m[5]) },
      onDelete: settings.delete || '', note: settings.note || '',
    });
  }

  const lineOf = (src, i) => src.slice(0, i).split('\n').length;

  function parse(raw) {
    raw = String(raw).replace(/\r\n?/g, '\n');
    const db = { project: null, tables: [], enums: [], groups: [], refs: [], warnings: [], legend: [], about: '' };

    // Legend lines like:  //   blue    #3B82F6  1. Foundation + Accounts
    for (const m of raw.matchAll(/^\s*\/\/\s*[\w-]+\s+(#[0-9a-f]{6})\s+(.+)$/gim)) {
      db.legend.push({ color: m[1].toUpperCase(), label: m[2].trim() });
    }
    // Leading comment block = schema notes.
    const lead = [];
    for (const line of raw.split('\n')) { if (/^\s*\/\//.test(line)) lead.push(line.replace(/^\s*\/\/ ?/, '')); else if (line.trim() || lead.length) break; }
    db.about = lead.join('\n').trim();

    const src = stripComments(raw);
    let i = 0;
    while (i < src.length) {
      const ws = /\s*/y; ws.lastIndex = i; ws.test(src); i = ws.lastIndex;
      if (i >= src.length) break;
      const rest = src.slice(i);
      let m = rest.match(/^Ref\b[^:{\n]*:\s*([^\n]+)/i);
      if (m) { addRefLine(db, m[1]); i += m[0].length; continue; }
      m = rest.match(/^(\w+)\b([^{\n]*)\{/);
      if (!m) throw new Error(`Unexpected input at line ${lineOf(src, i)}: "${rest.split('\n')[0].slice(0, 80)}"`);
      const open = i + m[0].length - 1;
      const close = open + matchBrace(src.slice(open));
      if (close < open) throw new Error(`Unclosed block "${m[1]} ${m[2].trim()}" at line ${lineOf(src, i)}`);
      handleBlock(db, m[1].toLowerCase(), m[2].trim(), src.slice(open + 1, close));
      i = close + 1;
    }
    link(db);
    return db;
  }

  function matchBrace(s) {
    let depth = 0, q = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) {
        if (q === "'''") { if (s.startsWith("'''", i)) { i += 2; q = null; } }
        else if (c === '\\') i++;
        else if (c === q) q = null;
        continue;
      }
      if (s.startsWith("'''", i)) { q = "'''"; i += 2; continue; }
      if (QUOTES.includes(c)) { q = c; continue; }
      if (c === '{') depth++;
      else if (c === '}' && --depth === 0) return i;
    }
    return -1;
  }

  function handleBlock(db, kind, header, body) {
    const hm = header.match(/^("[^"]+"|[\w.]+)?(?:\s+as\s+(\w+))?\s*(?:\[([\s\S]*)\])?/i) || [];
    const name = unquote(hm[1] || '');
    const settings = parseSettings(hm[3]);
    switch (kind) {
      case 'project': {
        const p = { name };
        for (const st of statements(body)) { const kv = st.match(/^(\w+)\s*:\s*([\s\S]+)$/); if (kv) p[kv[1].toLowerCase()] = unquote(kv[2]); }
        db.project = p;
        break;
      }
      case 'table': db.tables.push(parseTable(name, hm[2] || '', settings, body, db.warnings)); break;
      case 'enum':
        db.enums.push({
          name,
          values: statements(body).map(st => {
            const m = st.match(/^("[^"]+"|[^\s\[]+)\s*(?:\[([\s\S]*)\])?$/);
            return m ? { name: unquote(m[1]), note: parseSettings(m[2]).note || '' } : { name: st, note: '' };
          }),
        });
        break;
      case 'tablegroup':
        db.groups.push({ name, settings, tables: statements(body).filter(s => !/^note\s*[:{]/i.test(s)).map(unquote) });
        break;
      case 'ref': statements(body).forEach(l => addRefLine(db, l)); break;
      default: db.warnings.push(`ignored block "${kind} ${header}"`);
    }
  }

  const safeColor = c => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c.toUpperCase() : '#64748B');

  function prettyGroup(name) {
    const m = name.match(/^(.*?)[_-](\d+)$/);
    const words = (m ? m[1] : name).replace(/[_-]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
    return m ? `${m[2]} · ${words}` : words;
  }

  function link(db) {
    db.tableMap = new Map();
    for (const t of db.tables) { db.tableMap.set(t.name, t); if (t.alias) db.tableMap.set(t.alias, t); }
    db.enumMap = new Map(db.enums.map(e => [e.name, e]));
    const legendByColor = new Map(db.legend.map(l => [l.color, l.label]));

    // Inline refs become first-class relationships.
    for (const t of db.tables) {
      for (const c of t.columns) {
        for (const r of c.settings.refs) {
          const onDelete = (c.settings.note || '').match(/on delete (cascade|set null|set default|restrict|no action)/i);
          db.refs.push({ from: { table: t.name, column: c.name }, op: r.op, to: { table: r.table, column: r.column }, onDelete: onDelete ? onDelete[1].toLowerCase() : '', note: c.settings.note || '' });
        }
      }
    }
    for (const r of db.refs) {
      for (const end of [r.from, r.to]) {
        const t = db.tableMap.get(end.table);
        if (!t) db.warnings.push(`ref to unknown table "${end.table}"`);
        else { end.table = t.name; if (!t.columns.some(c => c.name === end.column)) db.warnings.push(`ref to unknown column "${t.name}.${end.column}"`); }
      }
    }

    for (const t of db.tables) {
      t.color = safeColor(t.settings.headercolor);
      t.legend = legendByColor.get(t.color) || '';
      t.pkCols = new Set(t.columns.filter(c => c.settings.pk).map(c => c.name));
      t.uniqueCols = new Set(t.columns.filter(c => c.settings.unique).map(c => c.name));
      t.indexedCols = new Map();
      for (const ix of t.indexes) {
        if (ix.settings.pk) ix.columns.forEach(n => t.pkCols.add(n));
        if (ix.settings.unique && ix.columns.length === 1) t.uniqueCols.add(ix.columns[0]);
        for (const n of ix.columns) {
          if (!t.indexedCols.has(n)) t.indexedCols.set(n, []);
          t.indexedCols.get(n).push(`(${ix.columns.join(', ')})${ix.settings.unique ? ' unique' : ''}${ix.settings.pk ? ' pk' : ''}`);
        }
      }
      t.outgoing = db.refs.filter(r => r.from.table === t.name);
      t.incoming = db.refs.filter(r => r.to.table === t.name);
      t.fkCols = new Map();
      for (const r of t.outgoing) { if (!t.fkCols.has(r.from.column)) t.fkCols.set(r.from.column, []); t.fkCols.get(r.from.column).push(r); }
      t.group = '';
    }

    db.groupList = db.groups.map(g => {
      const tables = g.tables.map(n => db.tableMap.get(n)).filter(Boolean);
      tables.forEach(t => { t.group = g.name; });
      return { name: g.name, label: prettyGroup(g.name), color: safeColor(g.settings.color || tables[0]?.color), tables };
    });
    const ungrouped = db.tables.filter(t => !t.group);
    if (ungrouped.length) {
      ungrouped.forEach(t => { t.group = '(ungrouped)'; });
      db.groupList.push({ name: '(ungrouped)', label: db.groups.length ? 'Ungrouped' : 'All tables', color: '#94A3B8', tables: ungrouped });
    }

    for (const e of db.enums) {
      e.usedBy = [];
      for (const t of db.tables) for (const c of t.columns) {
        if (c.type === e.name || c.type.endsWith('.' + e.name)) { c.enum = e.name; e.usedBy.push({ table: t.name, column: c.name }); }
      }
    }
    db.columnCount = db.tables.reduce((n, t) => n + t.columns.length, 0);
    db.indexCount = db.tables.reduce((n, t) => n + t.indexes.length, 0);
  }

  global.DBML = { parse };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
// ---------------------------------------------------------------------------
// Viewer
// ---------------------------------------------------------------------------
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
  const PREFS_KEY = 'dbml-preview:prefs:v2';
  const CARDINALITY = { '>': 'many → one', '<': 'one → many', '-': 'one → one', '<>': 'many ↔ many' };

  const state = {
    db: null, source: '', q: '', view: 'diagram', order: 'schema', showNotes: true, showIndexes: true, showSidebar: true,
    hiddenGroups: new Set(), collapsed: new Set(), relSort: { key: 'from', dir: 1 },
  };
  const PREF_KEYS = ['view', 'order', 'showNotes', 'showIndexes', 'showSidebar'];
  try { const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); PREF_KEYS.forEach(k => { if (k in p) state[k] = p[k]; }); } catch {}
  const savePrefs = () => { try { localStorage.setItem(PREFS_KEY, JSON.stringify(Object.fromEntries(PREF_KEYS.map(k => [k, state[k]])))); } catch {} };

  function hl(text) {
    text = String(text ?? '');
    if (!state.q) return esc(text);
    const re = new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    let out = '', last = 0;
    for (const m of text.matchAll(re)) { out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; }
    return out + esc(text.slice(last));
  }
  const has = (s, q) => String(s || '').toLowerCase().includes(q);

  function matchTable(t) {
    const q = state.q;
    if (!q) return { show: true, rows: new Set() };
    const rows = new Set(t.columns.filter(c => has(c.name, q) || has(c.type, q) || has(c.settings.note, q) || c.settings.refs.some(r => has(r.table, q))).map(c => c.name));
    const show = has(t.name, q) || has(t.note, q) || has(t.legend, q) || rows.size > 0 || t.indexes.some(ix => has(ix.settings.note, q));
    return { show, rows };
  }
  const visibleTables = () => state.db.tables.filter(t => !state.hiddenGroups.has(t.group)).map(t => ({ t, m: matchTable(t) })).filter(x => x.m.show);

  // ---- header & sidebar ---------------------------------------------------
  function renderHeader() {
    const db = state.db, p = db.project || {};
    $('#title').textContent = p.name ? `${p.name} — database schema` : 'Database schema';
    document.title = $('#title').textContent;
    $('#subtitle').textContent = p.note || '';
    $('#source').textContent = `Source: ${state.source}`;
    const stats = [
      [db.tables.length, 'tables'], [db.columnCount, 'columns'], [db.refs.length, 'relationships'],
      [db.indexCount, 'indexes'], [db.enums.length, 'enums'],
    ];
    if (p.database_type) stats.push([p.database_type, 'database']);
    $('#stats').innerHTML = stats.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
    const legend = db.legend.length ? db.legend : db.groupList.map(g => ({ color: g.color, label: g.label }));
    $('#legend').innerHTML = legend.map(l => `<span><i class="dot" style="--c:${esc(l.color)}"></i>${esc(l.label)}</span>`).join('');
    $('#about').hidden = !db.about;
    $('#about-text').textContent = db.about;
    const err = $('#error');
    err.classList.toggle('show', db.warnings.length > 0);
    err.innerHTML = db.warnings.length ? `<b>${db.warnings.length} parser warning(s):</b><br>${db.warnings.map(esc).join('<br>')}` : '';
  }

  function renderSidebar() {
    const db = state.db;
    $('#groups').innerHTML = db.groupList.map(g => `
      <label class="grp-row"><input type="checkbox" data-group="${esc(g.name)}" ${state.hiddenGroups.has(g.name) ? '' : 'checked'}>
      <span class="dot" style="--c:${esc(g.color)}"></span><span>${esc(g.label)}</span><span class="n">${g.tables.length}</span></label>`).join('');
    const vis = new Set(visibleTables().map(x => x.t.name));
    $('#nav').innerHTML = db.groupList.map(g => `
      <div class="nav-group ${state.hiddenGroups.has(g.name) ? 'off' : ''}">
        <div class="nav-h">${esc(g.label)}</div>
        ${g.tables.map(t => `<a href="#${esc(t.name)}" data-nav="${esc(t.name)}" class="${vis.has(t.name) ? '' : 'dim'}">
          <span class="dot" style="--c:${esc(t.color)}"></span><span class="name">${esc(t.name)}</span><span class="n">${t.columns.length}</span></a>`).join('')}
      </div>`).join('');
  }

  // ---- tables view --------------------------------------------------------
  function orderCols(t) {
    const cols = [...t.columns];
    if (state.order === 'alpha') cols.sort((a, b) => a.name.localeCompare(b.name));
    if (state.order === 'keys') {
      const rank = c => (t.pkCols.has(c.name) ? 0 : t.fkCols.has(c.name) ? 1 : t.uniqueCols.has(c.name) ? 2 : 3);
      cols.sort((a, b) => rank(a) - rank(b) || a.pos - b.pos);
    }
    return cols;
  }

  function colRow(t, c, m) {
    const s = c.settings, b = [];
    const isPk = t.pkCols.has(c.name);
    if (isPk) b.push('<span class="b pk" title="Primary key">PK</span>');
    for (const r of t.fkCols.get(c.name) || []) {
      b.push(`<a class="b fk" href="#${esc(r.to.table)}" data-jump="${esc(r.to.table)}" title="${esc(CARDINALITY[r.op] || r.op)}${r.onDelete ? ' · on delete ' + esc(r.onDelete) : ''}">FK → ${esc(r.to.table)}.${esc(r.to.column)}</a>`);
    }
    if (t.uniqueCols.has(c.name)) b.push('<span class="b uq" title="Unique">UQ</span>');
    if (s.increment) b.push('<span class="b ai" title="Auto increment / identity">AI</span>');
    if (s.notNull) b.push('<span class="b" title="Not null">NN</span>');
    else if (!isPk) b.push('<span class="b null">nullable</span>');
    if (t.indexedCols.has(c.name) && !isPk) b.push(`<span class="b idx" title="Indexed: ${esc(t.indexedCols.get(c.name).join(' · '))}">idx</span>`);
    s.flags.forEach(f => b.push(`<span class="b">${esc(f)}</span>`));

    const e = c.enum && state.db.enumMap.get(c.enum);
    const type = e
      ? `<a class="enum" href="#enum-${esc(e.name)}" data-enum="${esc(e.name)}" title="enum: ${esc(e.values.map(v => v.name).join(' | '))}"><code>${hl(c.type)}</code></a>`
      : `<code>${hl(c.type)}</code>`;
    const def = s.default ? `<code class="${s.default.expr ? 'expr' : ''}">${esc(s.default.value)}</code>` : '';
    return `<tr class="${m.rows.has(c.name) ? 'hit' : ''}">
      <td class="pos">${c.pos}</td><td class="cname">${hl(c.name)}</td><td class="ctype">${type}</td>
      <td class="keys">${b.join('')}</td><td class="def">${def}</td>
      ${state.showNotes ? `<td class="note">${hl(s.note)}</td>` : ''}</tr>`;
  }

  function indexesBlock(t) {
    return `<div class="indexes"><span class="lbl">Indexes</span><ul>${t.indexes.map(ix => `
      <li><code>(${ix.columns.map(esc).join(', ')})</code>
        ${ix.settings.pk ? '<span class="b pk">PK</span>' : ''}${ix.settings.unique ? '<span class="b uq">UNIQUE</span>' : ''}
        ${ix.settings.type ? `<span class="b">${esc(ix.settings.type)}</span>` : ''}
        ${ix.settings.name ? `<span class="muted">${esc(ix.settings.name)}</span>` : ''}
        ${ix.settings.note ? `<span class="ixnote">— ${hl(ix.settings.note)}</span>` : ''}</li>`).join('')}</ul></div>`;
  }

  function tableCard({ t, m }) {
    const collapsed = state.collapsed.has(t.name) && !state.q;
    const refs = [...new Map(t.incoming.map(r => [`${r.from.table}.${r.from.column}`, r])).values()];
    return `<section class="card ${collapsed ? 'collapsed' : ''}" id="t-${esc(t.name)}" style="--hc:${esc(t.color)}">
      <header data-toggle="${esc(t.name)}">
        <span class="chev">▶</span><h2>${hl(t.name)}</h2>${t.legend ? `<span class="tag">${hl(t.legend)}</span>` : ''}
        <span class="spacer"></span>
        <span class="meta">${t.columns.length} cols · ${t.indexes.length} idx · ${t.outgoing.length} FK · ${t.incoming.length} in</span>
      </header>
      <div class="body">
        ${t.note ? `<p class="tnote">${hl(t.note)}</p>` : ''}
        <div class="scroll"><table>
          <thead><tr><th>#</th><th>Column</th><th>Type</th><th>Keys &amp; constraints</th><th>Default</th>${state.showNotes ? '<th>Note</th>' : ''}</tr></thead>
          <tbody>${orderCols(t).map(c => colRow(t, c, m)).join('')}</tbody>
        </table></div>
        ${state.showIndexes && t.indexes.length ? indexesBlock(t) : ''}
        ${refs.length ? `<div class="incoming"><span class="lbl">Referenced by</span>${refs.map(r => `<a class="chip" href="#${esc(r.from.table)}" data-jump="${esc(r.from.table)}">${esc(r.from.table)}.<b>${esc(r.from.column)}</b></a>`).join('')}</div>` : ''}
      </div>
    </section>`;
  }

  // ---- enums view ---------------------------------------------------------
  function renderEnums() {
    const q = state.q;
    const list = state.db.enums.filter(e => !q || has(e.name, q) || e.values.some(v => has(v.name, q) || has(v.note, q)));
    if (!list.length) return empty();
    return `<div class="grid enums">${list.map(e => `
      <section class="card" id="enum-${esc(e.name)}" style="--hc:#A855F7">
        <header><h2>${hl(e.name)}</h2><span class="spacer"></span><span class="meta">${e.values.length} values</span></header>
        <div class="body">
          <ul class="vals">${e.values.map(v => `<li><code>${hl(v.name)}</code>${v.note ? `<span>${hl(v.note)}</span>` : ''}</li>`).join('')}</ul>
          ${e.usedBy.length ? `<div class="incoming"><span class="lbl">Used by</span>${e.usedBy.map(u => `<a class="chip" href="#${esc(u.table)}" data-jump="${esc(u.table)}">${esc(u.table)}.<b>${esc(u.column)}</b></a>`).join('')}</div>` : '<div class="incoming muted">Not used by any column</div>'}
        </div>
      </section>`).join('')}</div>`;
  }

  // ---- relationships view -------------------------------------------------
  const REL_COLS = [
    ['from', 'From'], ['card', 'Cardinality'], ['to', 'To'], ['onDelete', 'On delete'], ['note', 'Note'],
  ];
  function relValue(r, key) {
    switch (key) {
      case 'from': return `${r.from.table}.${r.from.column}`;
      case 'to': return `${r.to.table}.${r.to.column}`;
      case 'card': return CARDINALITY[r.op] || r.op;
      default: return r[key] || '';
    }
  }
  function renderRefs() {
    const db = state.db, q = state.q, { key, dir } = state.relSort;
    const rows = db.refs.filter(r => {
      const ft = db.tableMap.get(r.from.table), tt = db.tableMap.get(r.to.table);
      if ((ft && state.hiddenGroups.has(ft.group)) && (tt && state.hiddenGroups.has(tt.group))) return false;
      return !q || REL_COLS.some(([k]) => has(relValue(r, k), q));
    }).sort((a, b) => relValue(a, key).localeCompare(relValue(b, key)) * dir || relValue(a, 'from').localeCompare(relValue(b, 'from')));
    if (!rows.length) return empty();
    const link = end => `<a href="#${esc(end.table)}" data-jump="${esc(end.table)}">${hl(end.table)}.<b>${hl(end.column)}</b></a>`;
    return `<div class="rel scroll"><table>
      <thead><tr>${REL_COLS.map(([k, l]) => `<th data-sort="${k}">${l}${k === key ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${link(r.from)}</td><td><span class="b">${esc(r.op)}</span> ${esc(CARDINALITY[r.op] || '')}</td><td>${link(r.to)}</td>
        <td>${r.onDelete ? `<span class="b ${r.onDelete === 'cascade' ? 'pk' : ''}">${esc(r.onDelete)}</span>` : '<span class="muted">—</span>'}</td>
        <td class="note">${hl(r.note)}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }

  const empty = () => `<div class="empty">Nothing matches <b>${esc(state.q)}</b>${state.hiddenGroups.size ? ' in the selected groups' : ''}.</div>`;

  // ---- diagram view -------------------------------------------------------
  const DG = { HEADER: 34, ROW: 24, PAD_B: 6, MIN_W: 210, STUB: 24 };
  const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif';
  const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  const FONTS = { name: `600 13px ${SANS}`, col: `12.5px ${SANS}`, pk: `700 12.5px ${SANS}`, type: `11.5px ${MONO}` };
  const KEY_ICON = 'M8.5,12 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0 M15.5,12 H22 M19.5,12 V15 M22,12 V14.5';
  const dg = { x: 0, y: 0, k: 1, pos: null, sizes: new Map(), fitted: false, hover: null, pinned: null, drag: null, anim: 0, raf: 0 };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const layoutKey = () => 'dbml-layout:' + (state.db.project?.name || 'schema');
  const box = name => ({ ...dg.pos[name], ...dg.sizes.get(name) });
  const visibleNames = () => new Set(state.db.tables.filter(t => !state.hiddenGroups.has(t.group)).map(t => t.name));
  const columnHasRefs = (t, c) => state.db.refs.some(r => (r.from.table === t && r.from.column === c) || (r.to.table === t && r.to.column === c));

  let measureCtx;
  function textW(text, font) {
    measureCtx ??= document.createElement('canvas').getContext('2d');
    measureCtx.font = font;
    return measureCtx.measureText(String(text)).width;
  }

  function measureTables() {
    dg.sizes = new Map(state.db.tables.map(t => {
      let w = textW(t.name, FONTS.name) + (t.note ? 56 : 32);
      for (const c of t.columns) w = Math.max(w, 30 + textW(c.name, t.pkCols.has(c.name) ? FONTS.pk : FONTS.col) + 28 + textW(c.type, FONTS.type) + 14);
      return [t.name, { w: Math.ceil(Math.max(DG.MIN_W, w)), h: DG.HEADER + t.columns.length * DG.ROW + DG.PAD_B }];
    }));
  }

  // Groups flow left → right, wrapping rows; tables inside a group fill the shortest column first.
  function autoLayout() {
    const pos = {}, GAP = 56, GROUP_GAP = 120, SIDE = 28, TOP = 56, MAX_W = 3000;
    let cx = 0, cy = 0, rowH = 0;
    for (const g of state.db.groupList) {
      if (!g.tables.length) continue;
      const cols = Math.max(1, Math.round(Math.sqrt(g.tables.length * 0.9)));
      const colH = Array(cols).fill(0), colW = Array(cols).fill(0), slots = [];
      for (const t of g.tables) {
        const s = dg.sizes.get(t.name), c = colH.indexOf(Math.min(...colH));
        slots.push({ t, c, y: colH[c] });
        colH[c] += s.h + GAP;
        colW[c] = Math.max(colW[c], s.w);
      }
      const colX = colW.map((_, i) => colW.slice(0, i).reduce((a, w) => a + w + GAP, 0));
      const gw = colW.reduce((a, w) => a + w, 0) + GAP * (cols - 1) + SIDE * 2;
      const gh = Math.max(...colH) - GAP + TOP + SIDE;
      if (cx > 0 && cx + gw > MAX_W) { cx = 0; cy += rowH + GROUP_GAP; rowH = 0; }
      for (const s of slots) pos[s.t.name] = { x: cx + SIDE + colX[s.c], y: cy + TOP + s.y };
      cx += gw + GROUP_GAP;
      rowH = Math.max(rowH, gh);
    }
    return pos;
  }

  function ensureLayout() {
    if (dg.pos) return;
    measureTables();
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(layoutKey()) || '{}'); } catch {}
    dg.pos = Object.fromEntries(Object.entries(autoLayout()).map(([n, p]) => {
      const s = saved[n];
      return [n, s && Number.isFinite(s.x) && Number.isFinite(s.y) ? { x: s.x, y: s.y } : p];
    }));
  }
  const saveLayout = () => { try { localStorage.setItem(layoutKey(), JSON.stringify(dg.pos)); } catch {} };
  function resetLayout() {
    try { localStorage.removeItem(layoutKey()); } catch {}
    dg.pos = null;
    ensureLayout();
    drawDiagram();
    fit(true);
  }

  function tableSvg(t, m) {
    const { w, h } = dg.sizes.get(t.name), p = dg.pos[t.name], H = DG.HEADER, R = DG.ROW;
    const rows = t.columns.map((c, i) => {
      const pk = t.pkCols.has(c.name), fks = t.fkCols.get(c.name) || [], s = c.settings;
      const flags = [
        pk && 'PRIMARY KEY', ...fks.map(r => `FK → ${r.to.table}.${r.to.column}`), t.uniqueCols.has(c.name) && 'UNIQUE',
        s.increment && 'AUTO INCREMENT', s.notNull ? 'NOT NULL' : !pk && 'NULLABLE', s.default && `DEFAULT ${s.default.value}`,
      ].filter(Boolean).join(' · ');
      const tip = [`${t.name}.${c.name}  ${c.type}`, flags, s.note].filter(Boolean).join('\n');
      return `<g class="row${i % 2 ? ' alt' : ''}${m.rows.has(c.name) ? ' match' : ''}" data-c="${esc(c.name)}" transform="translate(0,${H + i * R})">
        <rect class="row-bg" x="1" width="${w - 2}" height="${R}"/>
        ${pk ? `<path class="pk-ico" d="${KEY_ICON}"/>` : ''}
        <text class="cn${pk ? ' pk' : ''}" x="28" y="16">${esc(c.name)}</text>
        <text class="ct${c.enum ? ' enum' : ''}" x="${w - 12}" y="16" text-anchor="end">${esc(c.type)}</text>
        <title>${esc(tip)}</title></g>`;
    }).join('');
    return `<g class="tbl${m.show ? '' : ' dim'}" data-t="${esc(t.name)}" transform="translate(${p.x},${p.y})" style="--hc:${esc(t.color)}">
      <rect class="tbl-bg" width="${w}" height="${h}" rx="8"/>
      <path class="tbl-head" d="M0,8 a8,8 0 0 1 8,-8 H${w - 8} a8,8 0 0 1 8,8 V${H} H0 Z"/>
      <text class="tbl-name" x="12" y="22">${esc(t.name)}</text>
      ${t.note ? `<g class="tbl-note"><circle cx="${w - 17}" cy="17" r="8"/><text x="${w - 17}" y="21" text-anchor="middle">i</text><title>${esc(t.note)}</title></g>` : ''}
      ${rows}
      <rect class="tbl-outline" width="${w}" height="${h}" rx="8"/>
    </g>`;
  }

  function anchorY(b, t, col) {
    const idx = t.columns.findIndex(c => c.name === col);
    return b.y + (idx < 0 ? DG.HEADER / 2 : DG.HEADER + idx * DG.ROW + DG.ROW / 2);
  }

  // Orthogonal connector between the two column rows, choosing the facing sides of both boxes.
  function edgeGeom(r, i) {
    const ta = state.db.tableMap.get(r.from.table), tb = state.db.tableMap.get(r.to.table);
    const A = box(ta.name), B = box(tb.name), S = DG.STUB;
    const ya = anchorY(A, ta, r.from.column), yb = anchorY(B, tb, r.to.column);
    let sa, sb;
    if (ta === tb) sa = sb = 1;
    else if (A.x + A.w + S * 2 <= B.x) { sa = 1; sb = -1; }
    else if (B.x + B.w + S * 2 <= A.x) { sa = -1; sb = 1; }
    else sa = sb = Math.abs(A.x + A.w - (B.x + B.w)) <= Math.abs(A.x - B.x) ? 1 : -1;
    const ax = sa > 0 ? A.x + A.w : A.x, bx = sb > 0 ? B.x + B.w : B.x;
    const spread = ((i % 5) - 2) * 5;
    const midX = sa !== sb
      ? (ax + bx) / 2 + spread
      : (sa > 0 ? Math.max(ax, bx) + S * 1.5 : Math.min(ax, bx) - S * 1.5) + Math.abs(spread) * sa;
    return { pts: [[ax, ya], [midX, ya], [midX, yb], [bx, yb]], a: { x: ax, y: ya, d: sa }, b: { x: bx, y: yb, d: sb } };
  }

  function roundPath(points, r = 8) {
    const pts = points.filter((p, i) => i === 0 || p[0] !== points[i - 1][0] || p[1] !== points[i - 1][1]);
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1), rr = Math.min(r, d1 / 2, d2 / 2);
      d += ` L${x1 + (x0 - x1) / d1 * rr},${y1 + (y0 - y1) / d1 * rr} Q${x1},${y1} ${x1 + (x2 - x1) / d2 * rr},${y1 + (y2 - y1) / d2 * rr}`;
    }
    const last = pts[pts.length - 1];
    return d + ` L${last[0]},${last[1]}`;
  }

  // Crow's foot for the "many" end, a single bar for the "one" end.
  function endMark({ x, y, d }, many) {
    const o = x + d * 14;
    return many ? `M${o},${y} L${x},${y - 6} M${o},${y} L${x},${y + 6}` : `M${x + d * 8},${y - 6} V${y + 6}`;
  }

  function drawTables() {
    const vis = visibleNames();
    $('#dg-tables').innerHTML = state.db.tables.filter(t => vis.has(t.name)).map(t => tableSvg(t, matchTable(t))).join('');
  }

  function drawEdges() {
    const vis = visibleNames(), db = state.db;
    const match = new Map(db.tables.map(t => [t.name, matchTable(t).show]));
    $('#dg-edges').innerHTML = db.refs.map((r, i) => {
      if (!vis.has(r.from.table) || !vis.has(r.to.table)) return '';
      const g = edgeGeom(r, i), d = roundPath(g.pts);
      const [manyA, manyB] = { '>': [true, false], '<': [false, true], '<>': [true, true] }[r.op] || [false, false];
      const dim = state.q && !(match.get(r.from.table) && match.get(r.to.table));
      return `<g class="edge${dim ? ' dim' : ''}" data-i="${i}" data-a="${esc(r.from.table)}" data-ac="${esc(r.from.column)}" data-b="${esc(r.to.table)}" data-bc="${esc(r.to.column)}">
        <path class="hit" d="${d}"/><path class="line" d="${d}"/><path class="mark" d="${endMark(g.a, manyA)} ${endMark(g.b, manyB)}"/>
        <title>${esc(`${r.from.table}.${r.from.column} ${r.op} ${r.to.table}.${r.to.column}${r.onDelete ? ' · on delete ' + r.onDelete : ''}`)}</title></g>`;
    }).join('');
    applyFocus();
  }

  function drawGroups() {
    $('#dg-groups').innerHTML = state.db.groupList
      .filter(g => g.name !== '(ungrouped)' && g.tables.length && !state.hiddenGroups.has(g.name))
      .map(g => {
        const bs = g.tables.map(t => box(t.name));
        const x0 = Math.min(...bs.map(b => b.x)) - 24, y0 = Math.min(...bs.map(b => b.y)) - 46;
        const x1 = Math.max(...bs.map(b => b.x + b.w)) + 24, y1 = Math.max(...bs.map(b => b.y + b.h)) + 24;
        return `<g style="--gc:${esc(g.color)}"><rect class="grp-box" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="14"/>
          <text class="grp-label" x="${x0 + 16}" y="${y0 + 28}">${esc(g.label)}</text></g>`;
      }).join('');
  }

  function drawDiagram() { drawGroups(); drawTables(); drawEdges(); }

  function scheduleRedraw() {
    if (dg.raf) return;
    dg.raf = requestAnimationFrame(() => { dg.raf = 0; drawGroups(); drawEdges(); });
  }

  function applyFocus() {
    const root = $('#diagram');
    if (!root?.querySelectorAll) return;
    const f = dg.hover || dg.pinned;
    root.classList.toggle('focus', !!f);
    root.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
    root.querySelectorAll('.tbl').forEach(el => el.classList.toggle('sel', dg.pinned?.t === el.dataset.t));
    if (!f) return;
    const tables = new Set(f.t ? [f.t] : []), rows = [];
    root.querySelectorAll('.edge').forEach(el => {
      const d = el.dataset;
      const hit = f.edge !== undefined ? String(f.edge) === d.i
        : f.c ? (d.a === f.t && d.ac === f.c) || (d.b === f.t && d.bc === f.c)
        : d.a === f.t || d.b === f.t;
      if (!hit) return;
      el.classList.add('hl');
      el.parentNode.appendChild(el);
      tables.add(d.a); tables.add(d.b);
      rows.push([d.a, d.ac], [d.b, d.bc]);
    });
    root.querySelectorAll('.tbl').forEach(el => { if (tables.has(el.dataset.t)) el.classList.add('hl'); });
    for (const [t, c] of rows) root.querySelector(`.tbl[data-t="${CSS.escape(t)}"] .row[data-c="${CSS.escape(c)}"]`)?.classList.add('hl');
  }

  function applyView() {
    const v = document.getElementById('dg-view');
    if (!v) return;
    const tf = `translate(${dg.x},${dg.y}) scale(${dg.k})`;
    v.setAttribute('transform', tf);
    document.getElementById('dg-grid')?.setAttribute('patternTransform', tf);
    const z = document.getElementById('dg-zoom');
    if (z) z.textContent = Math.round(dg.k * 100) + '%';
  }

  function animateTo(x, y, k) {
    const from = { x: dg.x, y: dg.y, k: dg.k }, t0 = performance.now();
    cancelAnimationFrame(dg.anim);
    const step = now => {
      const p = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - p, 3);
      dg.x = from.x + (x - from.x) * e; dg.y = from.y + (y - from.y) * e; dg.k = from.k + (k - from.k) * e;
      applyView();
      if (p < 1) dg.anim = requestAnimationFrame(step);
    };
    dg.anim = requestAnimationFrame(step);
  }

  const viewport = () => { const svg = $('#dg-svg'); return { W: svg?.clientWidth || 1200, H: svg?.clientHeight || 800 }; };

  function fit(animated) {
    const names = [...visibleNames()];
    if (!names.length) return;
    const bs = names.map(box), { W, H } = viewport();
    const x0 = Math.min(...bs.map(b => b.x)) - 30, y0 = Math.min(...bs.map(b => b.y)) - 50;
    const x1 = Math.max(...bs.map(b => b.x + b.w)) + 30, y1 = Math.max(...bs.map(b => b.y + b.h)) + 30;
    const k = clamp(Math.min((W - 40) / (x1 - x0), (H - 40) / (y1 - y0)), 0.08, 1.2);
    const x = (W - (x1 - x0) * k) / 2 - x0 * k, y = (H - (y1 - y0) * k) / 2 - y0 * k;
    if (animated) animateTo(x, y, k);
    else { Object.assign(dg, { x, y, k }); applyView(); }
  }

  function zoomBy(f, px, py, animated) {
    const { W, H } = viewport();
    px ??= W / 2; py ??= H / 2;
    const k = clamp(dg.k * f, 0.08, 2.5), r = k / dg.k;
    const x = px - (px - dg.x) * r, y = py - (py - dg.y) * r;
    if (animated) animateTo(x, y, k);
    else { Object.assign(dg, { x, y, k }); applyView(); }
  }

  function centerOn(name) {
    const t = state.db.tableMap.get(name);
    if (!t) return;
    if (state.hiddenGroups.has(t.group)) { state.hiddenGroups.delete(t.group); render(); }
    const b = box(t.name), { W, H } = viewport(), k = Math.max(dg.k, 0.9);
    const y = b.h * k < H - 80 ? H / 2 - (b.y + b.h / 2) * k : 60 - b.y * k;
    animateTo(W / 2 - (b.x + b.w / 2) * k, y, k);
    dg.pinned = { t: t.name };
    applyFocus();
    history.replaceState(null, '', '#' + t.name);
    const el = $(`#dg-tables .tbl[data-t="${CSS.escape(t.name)}"]`);
    if (el?.classList) { el.classList.remove('pulse'); void el.getBBox?.(); el.classList.add('pulse'); }
  }

  function sizeDiagram() {
    const el = $('#diagram');
    if (el?.getBoundingClientRect) el.style.height = Math.max(420, innerHeight - el.getBoundingClientRect().top - 16) + 'px';
  }

  const diagramShell = () => `<div class="diagram" id="diagram">
    <svg id="dg-svg" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="dg-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle class="dg-dot" cx="1.5" cy="1.5" r="1.2"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#dg-grid)"/>
      <g id="dg-view"><g id="dg-groups"></g><g id="dg-edges"></g><g id="dg-tables"></g></g>
    </svg>
    <div class="dg-controls">
      <button type="button" data-dg="out" title="Zoom out">−</button>
      <button type="button" data-dg="reset" id="dg-zoom" title="Reset to 100%">100%</button>
      <button type="button" data-dg="in" title="Zoom in">+</button>
      <button type="button" data-dg="fit" title="Fit all tables">Fit</button>
      <button type="button" data-dg="layout" title="Discard dragged positions">Auto-arrange</button>
    </div>
    <div class="dg-hint">Drag to pan · ⌘/Ctrl + scroll or pinch to zoom · drag tables to move · click to focus · double-click for details · \ hides sidebar</div>
  </div>`;

  function bindDiagram() {
    const svg = $('#dg-svg');
    const local = e => { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

    svg.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      cancelAnimationFrame(dg.anim);
      const tbl = e.target.closest('.tbl'), row = e.target.closest('.row');
      const s = { type: tbl ? 'table' : 'pan', name: tbl?.dataset.t, col: row?.dataset.c, sx: e.clientX, sy: e.clientY, moved: false };
      if (tbl) { const p = dg.pos[s.name]; s.ox = p.x; s.oy = p.y; tbl.parentNode.appendChild(tbl); }
      else { s.ox = dg.x; s.oy = dg.y; svg.classList.add('panning'); }
      dg.drag = s;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', e => {
      const s = dg.drag;
      if (!s) return;
      const dx = e.clientX - s.sx, dy = e.clientY - s.sy;
      if (!s.moved && Math.hypot(dx, dy) < 3) return;
      s.moved = true;
      if (s.type === 'pan') { dg.x = s.ox + dx; dg.y = s.oy + dy; applyView(); return; }
      const p = dg.pos[s.name];
      p.x = Math.round(s.ox + dx / dg.k);
      p.y = Math.round(s.oy + dy / dg.k);
      svg.querySelector(`.tbl[data-t="${CSS.escape(s.name)}"]`)?.setAttribute('transform', `translate(${p.x},${p.y})`);
      scheduleRedraw();
    });
    const end = () => {
      const s = dg.drag;
      dg.drag = null;
      svg.classList.remove('panning');
      if (!s) return;
      if (s.type === 'table' && s.moved) { saveLayout(); return; }
      if (s.type === 'table') {
        const target = { t: s.name, c: s.col && columnHasRefs(s.name, s.col) ? s.col : undefined };
        dg.pinned = dg.pinned && dg.pinned.t === target.t && dg.pinned.c === target.c ? null : target;
      } else if (!s.moved) dg.pinned = null;
      applyFocus();
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);

    svg.addEventListener('pointerover', e => {
      if (dg.drag) return;
      const tbl = e.target.closest('.tbl'), row = e.target.closest('.row'), edge = e.target.closest('.edge');
      const next = edge ? { edge: edge.dataset.i }
        : tbl ? { t: tbl.dataset.t, c: row && columnHasRefs(tbl.dataset.t, row.dataset.c) ? row.dataset.c : undefined }
        : null;
      if (JSON.stringify(next) !== JSON.stringify(dg.hover)) { dg.hover = next; applyFocus(); }
    });
    svg.addEventListener('pointerleave', () => { if (dg.hover) { dg.hover = null; applyFocus(); } });

    svg.addEventListener('wheel', e => {
      e.preventDefault();
      cancelAnimationFrame(dg.anim);
      const unit = e.deltaMode === 1 ? 16 : 1;
      if (e.ctrlKey || e.metaKey) zoomBy(Math.exp(-e.deltaY * unit * 0.01), ...local(e));
      else { dg.x -= e.deltaX * unit; dg.y -= e.deltaY * unit; applyView(); }
    }, { passive: false });

    svg.addEventListener('dblclick', e => {
      const tbl = e.target.closest('.tbl');
      if (tbl) jump(tbl.dataset.t);
      else zoomBy(1.5, ...local(e), true);
    });

    $('.dg-controls').addEventListener('click', e => {
      const action = e.target.closest('[data-dg]')?.dataset.dg;
      if (action === 'in') zoomBy(1.25, undefined, undefined, true);
      if (action === 'out') zoomBy(0.8, undefined, undefined, true);
      if (action === 'reset') zoomBy(1 / dg.k, undefined, undefined, true);
      if (action === 'fit') fit(true);
      if (action === 'layout') resetLayout();
    });
  }

  function buildDiagram() {
    $('#content').innerHTML = diagramShell();
    ensureLayout();
    sizeDiagram();
    drawDiagram();
    bindDiagram();
    if (dg.fitted) applyView();
    else { dg.fitted = true; fit(false); }
  }

  function renderMain() {
    const db = state.db;
    document.querySelectorAll('#tabs [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
    const vt = visibleTables();
    $('#n-tables').textContent = vt.length;
    $('#n-enums').textContent = db.enums.length;
    $('#n-refs').textContent = db.refs.length;
    $('#opt-notes').checked = state.showNotes;
    $('#opt-indexes').checked = state.showIndexes;
    $('#opt-order').value = state.order;
    const tableOnly = state.view === 'tables';
    ['#opt-notes', '#opt-indexes', '#opt-order'].forEach(s => { $(s).closest('label, select').style.display = tableOnly ? '' : 'none'; });
    ['#btn-collapse', '#btn-expand'].forEach(s => { $(s).style.display = tableOnly ? '' : 'none'; });

    document.body.classList.toggle('dg-mode', state.view === 'diagram');
    if (state.view === 'diagram') { window.scrollTo(0, 0); buildDiagram(); return; }
    $('#content').innerHTML =
      state.view === 'enums' ? renderEnums() :
      state.view === 'refs' ? renderRefs() :
      vt.length ? `<div class="grid">${vt.map(tableCard).join('')}</div>` : empty();
  }

  const render = () => { renderSidebar(); renderMain(); };

  // Keeps the diagram centred while its width changes with the sidebar.
  function setSidebar(show) {
    const before = state.view === 'diagram' ? viewport().W : 0;
    state.showSidebar = show;
    savePrefs();
    $('.app').classList.toggle('no-side', !show);
    $('#btn-sidebar').setAttribute('aria-pressed', String(show));
    if (state.view === 'diagram' && before) { dg.x += (viewport().W - before) / 2; applyView(); }
  }

  // ---- navigation ---------------------------------------------------------
  function flash(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  function jump(name, { smooth = true } = {}) {
    const t = state.db.tableMap.get(name);
    if (!t) return;
    state.view = 'tables';
    state.hiddenGroups.delete(t.group);
    state.collapsed.delete(t.name);
    if (state.q && !matchTable(t).show) { state.q = ''; $('#search').value = ''; }
    savePrefs();
    render();
    history.replaceState(null, '', '#' + t.name);
    const el = document.getElementById('t-' + t.name);
    smooth ? flash(el) : el?.scrollIntoView();
  }
  function jumpEnum(name) {
    state.view = 'enums';
    if (state.q && !has(name, state.q)) { state.q = ''; $('#search').value = ''; }
    savePrefs();
    render();
    history.replaceState(null, '', '#enum-' + name);
    flash(document.getElementById('enum-' + name));
  }

  // ---- loading ------------------------------------------------------------
  function load(text, source) {
    try {
      const db = DBML.parse(text);
      state.db = db;
      state.source = source;
      const names = new Set(db.groupList.map(g => g.name));
      state.hiddenGroups = new Set([...state.hiddenGroups].filter(g => names.has(g)));
      state.collapsed = new Set([...state.collapsed].filter(n => db.tableMap.has(n)));
      Object.assign(dg, { pos: null, fitted: false, hover: null, pinned: null });
      renderHeader();
      render();
    } catch (err) {
      const box = $('#error');
      box.classList.add('show');
      box.innerHTML = `<b>Could not parse ${esc(source)}:</b> ${esc(err.message)}`;
    }
  }

  async function boot() {
    let text = $('#dbml-source').textContent.replace(/^\n/, ''), source = 'embedded snapshot';
    if (location.protocol.startsWith('http')) {
      try {
        const res = await fetch('launchpad.dbml', { cache: 'no-store' });
        if (res.ok) { text = await res.text(); source = 'launchpad.dbml (live)'; }
      } catch {}
    } else {
      $('#serve-hint').hidden = false;
    }
    load(text, source);
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash.startsWith('enum-')) jumpEnum(hash.slice(5));
    else if (hash && state.view === 'diagram') centerOn(hash);
    else if (hash) jump(hash, { smooth: false });
  }

  // ---- events -------------------------------------------------------------
  $('#serve-copy').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText($('#serve-cmd').textContent); e.target.textContent = 'Copied'; }
    catch { getSelection().selectAllChildren($('#serve-cmd')); e.target.textContent = 'Press ⌘C'; }
    setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
  });
  $('#search').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $('#groups').addEventListener('change', e => {
    const g = e.target.dataset.group;
    if (g === undefined) return;
    e.target.checked ? state.hiddenGroups.delete(g) : state.hiddenGroups.add(g);
    render();
  });
  $('#groups-all').addEventListener('click', () => {
    state.hiddenGroups = state.hiddenGroups.size ? new Set() : new Set(state.db.groupList.map(g => g.name));
    render();
  });
  $('#opt-notes').addEventListener('change', e => { state.showNotes = e.target.checked; savePrefs(); renderMain(); });
  $('#opt-indexes').addEventListener('change', e => { state.showIndexes = e.target.checked; savePrefs(); renderMain(); });
  $('#opt-order').addEventListener('change', e => { state.order = e.target.value; savePrefs(); renderMain(); });
  $('#btn-collapse').addEventListener('click', () => { state.collapsed = new Set(state.db.tables.map(t => t.name)); renderMain(); });
  $('#btn-expand').addEventListener('click', () => { state.collapsed.clear(); renderMain(); });

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); state.view === 'diagram' ? centerOn(nav.dataset.nav) : jump(nav.dataset.nav); return; }
    const j = e.target.closest('[data-jump]');
    if (j) { e.preventDefault(); jump(j.dataset.jump); return; }
    const en = e.target.closest('[data-enum]');
    if (en) { e.preventDefault(); jumpEnum(en.dataset.enum); return; }
    const tg = e.target.closest('[data-toggle]');
    if (tg) {
      const n = tg.dataset.toggle;
      state.collapsed.has(n) ? state.collapsed.delete(n) : state.collapsed.add(n);
      tg.parentElement.classList.toggle('collapsed');
      return;
    }
    const s = e.target.closest('[data-sort]');
    if (s) {
      const k = s.dataset.sort;
      state.relSort = { key: k, dir: state.relSort.key === k ? -state.relSort.dir : 1 };
      renderMain();
      return;
    }
    const tab = e.target.closest('[data-view]');
    if (tab) { state.view = tab.dataset.view; savePrefs(); renderMain(); window.scrollTo({ top: 0 }); }
  });

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); if (!state.showSidebar) setSidebar(true); $('#search').focus(); $('#search').select(); }
    if (e.key === '\\' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setSidebar(!state.showSidebar); }
    if (e.key === 'Escape' && document.activeElement === $('#search')) { $('#search').value = ''; state.q = ''; render(); $('#search').blur(); }
  });

  $('#file').addEventListener('change', async e => {
    const f = e.target.files[0];
    if (f) load(await f.text(), f.name);
    e.target.value = '';
  });
  addEventListener('resize', () => { if (state.view === 'diagram') sizeDiagram(); });
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  addEventListener('drop', async e => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f) load(await f.text(), f.name);
  });

  $('#btn-sidebar').addEventListener('click', () => setSidebar(!state.showSidebar));
  setSidebar(state.showSidebar);
  boot();
})();
</script>
</body>
</html>
